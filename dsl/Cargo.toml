[package]
name = "insgr_rust"
version = "1.0.0"
edition = "2021"
authors = ["SHV Groups AGI Research"]
description = "High-performance zero-allocation execution sandbox for Eunoia Raiden"

[lib]
name = "insgr_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.1", features = ["extension-module"] }
lazy_static = "1.4"
dashmap = "5.5.3" # High-performance concurrent hashmap for our Task Arena

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true